modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version},)"
license = "MIT"

[[mods]]
modId = "reconnect"

version = "${version}"
displayName = "Reconnect"

logoFile = "icon.png"

authors = "xa59"

description = '''
A simple mod that reconnects the user inside a multiplayer world without leaving.
'''

[[mixins]]
config = "reconnect.mixins.json"

[[dependencies.reconnect]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
side = "CLIENT"

[[dependencies.reconnect]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
side = "CLIENT"
