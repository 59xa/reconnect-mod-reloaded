name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6", "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Minecraft ${{ matrix.minecraft }}
        run: ./gradlew "-Pbuild_versions=${{ matrix.minecraft }}" build --max-workers=1
      - name: Verify packaged artefacts
        run: python3 scripts/verify_artefacts.py "${{ matrix.minecraft }}"
      - name: Capture build artefacts
        uses: actions/upload-artifact@v6
        with:
          name: reconnect-${{ matrix.minecraft }}
          path: build/libs/${{ matrix.minecraft }}/*.jar
          if-no-files-found: error
